[project]
name = "adpbulk"
version = "0.2.0"
requires-python = ">=3.7"
authors = [{ name = "Noam Teyssier", email = "noam.teyssier@ucsf.edu" }]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
    "anndata>=0.7.4",
    "numpy>=1.17.0",
    "pandas>=0.21",
    "tqdm",
]

[project.urls]
Source = "https://github.com/noamteyssier/adpbulk"

[dependency-groups]
dev = [
    "pytest>=7.4.4",
]
